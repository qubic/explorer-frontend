name: 🚀 Deploy

on:
  # Only `push` — a merged PR already produces a push to the target branch, so
  # merges still deploy exactly once. Closing a PR *without* merging changes no
  # ref, so it produces no push and (correctly) does not deploy.
  #
  # `main` is intentionally NOT here: production is deployed by
  # release-please.yml only when a stable release is cut, so an intermediate
  # (e.g. rc) version can never be shipped to prod. This workflow deploys the
  # non-production environments only.
  push:
    branches:
      - dev
      - staging
      - testnet

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do not cancel an in-progress deploy; let it finish to avoid partial uploads.
  cancel-in-progress: false

# Secure default: no permissions unless a job opts in below.
permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read # just checkout + build; no pushes here anymore
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: ⚙️ Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: 🔧 Set up Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build app
        env:
          VITE_NETWORK: ${{ github.ref == 'refs/heads/testnet' && 'testnet' || 'mainnet' }}
          VITE_QUBIC_RPC_URL: ${{ github.ref == 'refs/heads/testnet' && secrets.QUBIC_RPC_URL_TESTNET || secrets.QUBIC_RPC_URL }}
          VITE_STATIC_API_URL: |
            ${{
              (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testnet') && secrets.STATIC_API_URL ||
              github.ref == 'refs/heads/staging' && secrets.STATIC_API_URL_STAGING ||
              secrets.STATIC_API_URL_DEV
            }}
        run: pnpm run build

      - name: 📦 Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    # Gate production only: `main` uses the protected `production` environment
    # (required reviewers + prevent self-review), so a prod deploy waits for a
    # manual approval. Other branches use their own ungated environments.
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || github.ref_name }}
    steps:
      - name: 📥 Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: 📤 Deploy to the corresponding environment
        uses: SamKirkland/FTP-Deploy-Action@cfcb39fa3cdf2ff98ac1a7fbfa539d20526d474d # 4.3.3
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: |
            ${{
              github.ref == 'refs/heads/main' && secrets.FTP_USERNAME_PROD ||
              github.ref == 'refs/heads/testnet' && secrets.FTP_USERNAME_TESTNET ||
              github.ref == 'refs/heads/staging' && secrets.FTP_USERNAME_STAGING ||
              secrets.FTP_USERNAME_DEV
            }}
          password: |
            ${{
              github.ref == 'refs/heads/main' && secrets.FTP_PASSWORD_PROD ||
              github.ref == 'refs/heads/testnet' && secrets.FTP_PASSWORD_TESTNET ||
              github.ref == 'refs/heads/staging' && secrets.FTP_PASSWORD_STAGING ||
              secrets.FTP_PASSWORD_DEV
            }}
          local-dir: dist/
          protocol: ftps
