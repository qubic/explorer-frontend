name: 🚀 Release and Deploy

on:
  # Only `push` — a merged PR already produces a push to the target branch, so
  # merges still deploy exactly once. Closing a PR *without* merging changes no
  # ref, so it produces no push and (correctly) does not deploy. Listening to
  # `pull_request: closed` as well would deploy every merge twice.
  push:
    branches:
      - dev
      - staging
      - main
      - testnet

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do not cancel an in-progress deploy; let it finish to avoid partial uploads.
  cancel-in-progress: false

# Secure default: no permissions unless a job opts in below.
permissions: {}

jobs:
  release-and-deploy:
    name: Release and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write # semantic-release pushes the release commit + tag
      issues: write # semantic-release comments on released issues
      pull-requests: write # semantic-release comments on released PRs
    steps:
      # persist-credentials is intentionally left enabled (the default) so that
      # semantic-release can push the release commit + tag via GITHUB_TOKEN.
      - name: 🛎️ Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0 # Fetch full commit history

      - name: ⚙️ Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: 🔧 Set up Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔖 Run Semantic Release
        run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'

      - name: 🏗️ Build app
        env:
          VITE_NETWORK: ${{ github.ref == 'refs/heads/testnet' && 'testnet' || 'mainnet' }}
          VITE_QLI_API_URL: ${{ secrets.QLI_API_URL }}
          VITE_QUBIC_RPC_URL: ${{ github.ref == 'refs/heads/testnet' && secrets.QUBIC_RPC_URL_TESTNET || secrets.QUBIC_RPC_URL }}
          VITE_STATIC_API_URL: |
            ${{
              (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testnet') && secrets.STATIC_API_URL ||
              github.ref == 'refs/heads/staging' && secrets.STATIC_API_URL_STAGING ||
              secrets.STATIC_API_URL_DEV
            }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: pnpm run build

      - name: 📤 Deploy to the corresponding environment
        uses: SamKirkland/FTP-Deploy-Action@cfcb39fa3cdf2ff98ac1a7fbfa539d20526d474d # 4.3.3
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: |
            ${{
              github.ref == 'refs/heads/main' && secrets.FTP_USERNAME_PROD ||
              github.ref == 'refs/heads/testnet' && secrets.FTP_USERNAME_TESTNET ||
              github.ref == 'refs/heads/staging' && secrets.FTP_USERNAME_STAGING ||
              secrets.FTP_USERNAME_DEV
            }}
          password: |
            ${{
              github.ref == 'refs/heads/main' && secrets.FTP_PASSWORD_PROD ||
              github.ref == 'refs/heads/testnet' && secrets.FTP_PASSWORD_TESTNET ||
              github.ref == 'refs/heads/staging' && secrets.FTP_PASSWORD_STAGING ||
              secrets.FTP_PASSWORD_DEV
            }}
          local-dir: dist/
          protocol: ftps
